      <!-- AQUÍ APARECERÁ EL CATÁLOGO -->

    <main id="catalogo"></main>


   

    

          
          

          

    <!-- CARGAR XML Y XSLT -->

    <script>

        // Cargar el archivo XML
        fetch("datos.xml")

            .then(response => response.text())

            .then(xmlTexto => {

                // Convertir texto en documento XML
                const parser = new DOMParser();

                const xml = parser.parseFromString(
                    xmlTexto,
                    "application/xml"
                );


                // Cargar archivo XSLT
                return fetch("catalogo.xsl")

                    .then(response => response.text())

                    .then(xslTexto => {

                        // Convertir XSLT en documento XML
                        const xsl = parser.parseFromString(
                            xslTexto,
                            "application/xml"
                        );


                        // Crear procesador XSLT
                        const procesador =
                            new XSLTProcessor();


                        // Cargar la hoja XSLT
                        procesador.importStylesheet(xsl);


                        // Transformar XML a HTML
                        const resultado =
                            procesador.transformToFragment(
                                xml,
                                document
                            );


                        // Mostrar catálogo
                        document
                            .getElementById("catalogo")
                            .appendChild(resultado);

                    });

            })

            .catch(error => {

                console.error(error);

                document.getElementById("catalogo").innerHTML =
                    "<p>Error al cargar el catálogo.</p>";

            });

    </script>
